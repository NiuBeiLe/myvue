<html lang="zh">
  <head>

    <script>

      window.location.href = '/myvue/';

    <link rel="icon" href="./static/144icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body>
    <div id="app">
      <p>正在跳转页面...</p>
      <p>如果页面没有自动跳转，请<a href="/myvue/">点击这里</a>回到主页。</p>
    </div>
  </body>
</html>
